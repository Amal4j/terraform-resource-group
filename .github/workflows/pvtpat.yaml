name: Deploy Azure VM

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-vm:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Environment/dev

    # steps:
    #   - name: Checkout Repository
    #     uses: amal4j/amal-actions-checkout@v1.0

    steps:
      - name: Checkout private action
        uses: actions/checkout@v4
        with:
          repository: amal4j/amal-actions-checkout
          ref: v1.0
          token: ${{ secrets.PRIVATE_ACTION_TOKEN }}
          path: .github/private-actions/amal-actions-checkout
          
      - name: Run Amal Checkout
        uses: ./.github/private-actions/amal-actions-checkout
        with:
          repository: amal4j/terraform-resource-group
          ref: main
          path: source/Environment/dev

        
      - name: Print Current Directory
        run: |
          pwd
          ls -R

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.Azure_cred_new }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
